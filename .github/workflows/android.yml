name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # L'SDK Android e' gia' installato su ubuntu-latest (ANDROID_HOME).
      # Accetto solo le licenze, cosi' Gradle puo' scaricare eventuali componenti mancanti.
      - name: Accetta licenze Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila APK (debug + release)
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Carica APK debug
        uses: actions/upload-artifact@v4
        with:
          name: CutTheRope-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Carica APK release
        uses: actions/upload-artifact@v4
        with:
          name: CutTheRope-release-apk
          path: app/build/outputs/apk/release/*.apk
